name: pages
on:
  push:
    branches: [main, master]
    paths: ['docs/**', 'README.md', 'tools/check_submission.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify submission evidence and static links
        run: python tools/check_submission.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          test "${SITE_URL%/}" = 'https://sokldjs554.github.io/npu-region-repair'
          for rel in '' index.html results/summary.json results/records.csv DESIGN_DECISIONS.md VALIDATION.md; do
            ok=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30                 "${SITE_URL%/}/$rel?publication=$GITHUB_SHA" -o /tmp/nrr-public; then
                ok=true
                break
              fi
              sleep 10
            done
            if [ "$ok" != true ]; then
              echo "::error::Public file unavailable: ${rel:-/}"
              exit 1
            fi
          done
          echo "Verified public NPU Region Repair site for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
