name: cpu-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install -e '.[dev]'
      - name: Test actual CPU paths; optional TensorFlow test is explicitly skipped
        run: python -m pytest -q -rs
      - name: Independent local-run smoke test
        run: |
          python -m nrr run --out runs/ci-cpu --teacher-steps 20 --budget-steps 5 --threads 1
          python -m nrr verify runs/ci-cpu
      - name: Preserve CPU evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-evidence
          path: runs/ci-cpu/
